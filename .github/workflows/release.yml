name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish portable packages
        shell: pwsh
        run: .\scripts\publish-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows"
      - name: Restore MSIX certificate
        if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\MidnightVault.pfx",
            [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
      - name: Build signed MSIX
        if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          dotnet publish windows/src/MidnightVault.Desktop/MidnightVault.Desktop.csproj `
            --configuration Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageDir="$env:RUNNER_TEMP\windows\MSIX\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$env:RUNNER_TEMP\MidnightVault.pfx" `
            -p:PackageCertificatePassword="$env:WINDOWS_PFX_PASSWORD"
      - uses: actions/upload-artifact@v7
        with:
          name: MidnightVault-Windows-x64
          path: ${{ runner.temp }}\windows\**
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK 37
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
      - name: Restore Android keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/midnightvault.jks"
      - name: Build APK
        working-directory: android
        env:
          MIDNIGHTVAULT_ANDROID_KEYSTORE: ${{ runner.temp }}/midnightvault.jks
          MIDNIGHTVAULT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MIDNIGHTVAULT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MIDNIGHTVAULT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f "$MIDNIGHTVAULT_ANDROID_KEYSTORE" ]; then
            ./gradlew lint test assembleRelease --stacktrace
          else
            ./gradlew lint test assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: MidnightVault-Android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  termux:
    name: Termux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build package
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/termux
          cd server
          go build -trimpath -ldflags="-s -w" -o ../dist/termux/midnightvault-server ./cmd/midnightvault-server
          cd ..
          cp server/termux/install.sh server/termux/run.sh dist/termux/
          chmod +x dist/termux/*
          tar -C dist -czf MidnightVault-Termux-linux-arm64.tar.gz termux
      - uses: actions/upload-artifact@v7
        with:
          name: MidnightVault-Termux-linux-arm64
          path: MidnightVault-Termux-linux-arm64.tar.gz
          archive: false
          if-no-files-found: error
